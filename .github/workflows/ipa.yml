name: Build Unsigned IPA
# 免费侧载路线(不经过 TestFlight):产出未签名 ipa 工件,
# 下载后用 Sideloadly/爱思助手以自己的 Apple ID 签名安装(7 天有效)。
on:
  workflow_dispatch:

jobs:
  ipa:
    runs-on: macos-15
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 选择可用 Xcode(最新版启动崩溃则回退镜像默认)
        run: |
          LATEST=$(ls -d /Applications/Xcode*.app | sort -V | tail -1)
          sudo xcode-select -s "$LATEST" 2>/dev/null || true
          if ! xcodebuild -version >/dev/null 2>&1; then
            echo "$LATEST 启动异常(Trace/BPT trap),回退镜像默认 Xcode"
            sudo xcode-select -r
          fi
          xcodebuild -version

      - name: 免签名编译
        run: |
          xcodebuild -project PlaneWar.xcodeproj \
            -scheme PlaneWar \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build/dd \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO build

      - name: 打包未签名 IPA
        run: |
          APP=$(find build/dd/Build/Products -maxdepth 3 -name "*.app" | head -1)
          echo "产物: $APP"
          mkdir Payload
          cp -R "$APP" Payload/
          zip -qry PlaneWar-unsigned.ipa Payload

      - name: 上传工件
        uses: actions/upload-artifact@v4
        with:
          name: PlaneWar-unsigned-ipa
          path: PlaneWar-unsigned.ipa

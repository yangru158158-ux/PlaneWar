name: Build Unsigned IPA
# 免费侧载路线(不经过 TestFlight):产出未签名 ipa 工件,
# 下载后用 Sideloadly/爱思助手以自己的 Apple ID 签名安装(7 天有效)。
on:
  workflow_dispatch:

jobs:
  ipa:
    runs-on: macos-26
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 选择可用 Xcode(逐个真编译自检,自动回退)
        run: |
          printf 'int plane_war_canary(void){return 263;}\n' > /tmp/canary.c
          for XC in $(ls -d /Applications/Xcode*.app | sort -Vr); do
            echo "== 试 $XC"
            sudo xcode-select -s "$XC" 2>/dev/null || continue
            sudo xcodebuild -runFirstLaunch >/dev/null 2>&1 || true
            if xcrun -sdk iphoneos clang -arch arm64 -c /tmp/canary.c -o /tmp/canary.o >/dev/null 2>&1; then
              echo "== 使用 $XC"
              xcodebuild -version
              exit 0
            fi
            echo "== $XC 工具链异常(Trace/BPT trap 一类),换下一个"
          done
          echo "所有 Xcode 都不可用"
          exit 1

      - name: 安装 XcodeGen 并生成工程
        run: |
          brew install xcodegen
          xcodegen generate

      - name: 免签名编译
        run: |
          xcodebuild -project PlaneWar.xcodeproj \
            -scheme PlaneWar \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build/dd \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO build

      - name: 打包未签名 IPA
        run: |
          APP=$(find build/dd/Build/Products -maxdepth 3 -name "*.app" | head -1)
          echo "产物: $APP"
          mkdir Payload
          cp -R "$APP" Payload/
          zip -qry PlaneWar-unsigned.ipa Payload

      - name: 上传工件
        uses: actions/upload-artifact@v4
        with:
          name: PlaneWar-unsigned-ipa
          path: PlaneWar-unsigned.ipa

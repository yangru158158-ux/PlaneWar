name: Build Check
# 零成本编译验证:每次推送自动在 GitHub 的 macOS 机器上编译整个 App
# (公开仓库免费;私有仓库 macOS 分钟按 10 倍计费,注意)
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-15
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 选择可用 Xcode(最新版启动崩溃则回退镜像默认)
        run: |
          LATEST=$(ls -d /Applications/Xcode*.app | sort -V | tail -1)
          sudo xcode-select -s "$LATEST" 2>/dev/null || true
          if ! xcodebuild -version >/dev/null 2>&1; then
            echo "$LATEST 启动异常(Trace/BPT trap),回退镜像默认 Xcode"
            sudo xcode-select -r
          fi
          xcodebuild -version

      - name: 编译验证(免签名)
        run: |
          xcodebuild -project PlaneWar.xcodeproj \
            -scheme PlaneWar \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            build

      - name: 结果
        run: echo "✅ 编译通过,可以进入 TestFlight 发布流程"

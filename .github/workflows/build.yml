name: Build Check
# 零成本编译验证:每次推送自动在 GitHub 的 macOS 机器上编译整个 App
# (公开仓库免费;私有仓库 macOS 分钟按 10 倍计费,注意)
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-15
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 选择可用 Xcode(逐个真编译自检,自动回退)
        run: |
          printf 'int plane_war_canary(void){return 263;}\n' > /tmp/canary.c
          for XC in $(ls -d /Applications/Xcode*.app | sort -Vr); do
            echo "== 试 $XC"
            sudo xcode-select -s "$XC" 2>/dev/null || continue
            sudo xcodebuild -runFirstLaunch >/dev/null 2>&1 || true
            if xcrun -sdk iphoneos clang -arch arm64 -c /tmp/canary.c -o /tmp/canary.o >/dev/null 2>&1; then
              echo "== 使用 $XC"
              xcodebuild -version
              exit 0
            fi
            echo "== $XC 工具链异常(Trace/BPT trap 一类),换下一个"
          done
          echo "所有 Xcode 都不可用"
          exit 1

      - name: 编译验证(免签名)
        run: |
          xcodebuild -project PlaneWar.xcodeproj \
            -scheme PlaneWar \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            build

      - name: 结果
        run: echo "✅ 编译通过,可以进入 TestFlight 发布流程"

name: Build Check
# 零成本编译验证:每次推送自动在 GitHub 的 macOS 机器上编译整个 App
# (公开仓库免费;私有仓库 macOS 分钟按 10 倍计费,注意)
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-15
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 选择可用 Xcode(逐个真编译自检,自动回退)
        run: |
          printf 'int plane_war_canary(void){return 263;}\n' > /tmp/canary.c
          for XC in $(ls -d /Applications/Xcode*.app | sort -Vr); do
            echo "== 试 $XC"
            sudo xcode-select -s "$XC" 2>/dev/null || continue
            sudo xcodebuild -runFirstLaunch >/dev/null 2>&1 || true
            if xcrun -sdk iphoneos clang -arch arm64 -c /tmp/canary.c -o /tmp/canary.o >/dev/null 2>&1; then
              echo "== 使用 $XC"
              xcodebuild -version
              exit 0
            fi
            echo "== $XC 工具链异常(Trace/BPT trap 一类),换下一个"
          done
          echo "所有 Xcode 都不可用"
          exit 1

      - name: 编译验证(免签名,崩溃时抓 .ips 堆栈)
        run: |
          set +e
          echo "=== 1) xcodebuild -list(探工程文件解析) ==="
          xcodebuild -list -project PlaneWar.xcodeproj
          echo "=== 2) 真编译 ==="
          xcodebuild -project PlaneWar.xcodeproj \
            -scheme PlaneWar \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            build
          RC=$?
          echo "=== 3) 崩溃报告(若有) ==="
          CRASH=$(ls -t "$HOME/Library/Logs/DiagnosticReports/"xcodebuild*.ips 2>/dev/null | head -1)
          echo "报告: $CRASH"
          if [ -n "$CRASH" ]; then
            python3 - "$CRASH" <<'PY'
import json, sys
raw = open(sys.argv[1]).read()
body = json.loads(raw[raw.index('{'):])
print("exception:", json.dumps(body.get("exception", {})))
print("termination:", json.dumps(body.get("termination", {})))
ft = body.get("faultingThread", 0)
imgs = body.get("usedImages", [])
for f in body["threads"][ft].get("frames", [])[:25]:
    img = imgs[f["imageIndex"]].get("name", "?") if "imageIndex" in f else "?"
    print(f"{img}  {f.get('symbol','?')} +{f.get('symbolLocation','')}")
PY
          fi
          exit $RC

      - name: 结果
        run: echo "✅ 编译通过,可以进入 TestFlight 发布流程"

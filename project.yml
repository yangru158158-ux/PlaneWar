name: PlaneWar
options:
  bundleIdPrefix: com.planewar
  deploymentTarget:
    iOS: "16.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
    GENERATE_INFOPLIST_FILE: "NO"
    INFOPLIST_FILE: Info.plist
    TARGETED_DEVICE_FAMILY: "1,2"
    ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
targets:
  PlaneWar:
    type: application
    platform: iOS
    sources:
      - path: PlaneWar
    settings:
      base:
        PRODUCT_NAME: "$(TARGET_NAME)"
        INFOPLIST_FILE: Info.plist
        PRODUCT_BUNDLE_IDENTIFIER: com.planewar.thunder
        DEVELOPMENT_TEAM: QBU3P5SMNS
        CODE_SIGN_STYLE: Manual
        CODE_SIGN_IDENTITY: Apple Distribution
        PROVISIONING_PROFILE_SPECIFIER: PlaneWar AppStore
schemes:
  PlaneWar:
    build:
      targets:
        PlaneWar: all
    run:
      config: Debug
    archive:
      config: Release
    profile:
      config: Release
    analyze:
      config: Debug
